name: Docker CI-CD

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  build-test-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: winter-arc-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test application
        run: |
          set -eu

          docker run -d \
            --name api \
            -p 5000:5000 \
            winter-arc-app:${{ github.sha }}

          trap 'docker rm -f api >/dev/null 2>&1 || true' EXIT

          for i in $(seq 1 15); do
            if curl -fsS http://localhost:5000/health; then
              echo
              echo "Health check passed"
              exit 0
            fi
            sleep 2
          done

          docker logs api
          echo "Health check failed"
          exit 1

      - name: Scan image with Trivyuses: aquasecurity/trivy-action@0.33.1
        
        with:
          image-ref: winter-arc-app:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag image for Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu
          test -n "$DOCKERHUB_USERNAME"

          docker tag \
            winter-arc-app:${{ github.sha }} \
            "$DOCKERHUB_USERNAME/winter-arc-app:${{ github.sha }}"

      - name: Publish SHA-tagged image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -eu
          docker push \
            "$DOCKERHUB_USERNAME/winter-arc-app:${{ github.sha }}"
